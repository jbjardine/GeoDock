name: proxy-ci

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --disable-pip-version-check PyYAML
      - name: Validate workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/proxy-ci.yml', encoding='utf-8'))"
      - name: Validate shell syntax
        run: bash -n scripts/*.sh proxy/docker-entrypoint.d/*.sh proxy/docker-entrypoint.d/*.envsh tests/*.sh
      - name: Shellcheck scripts strictly
        run: shellcheck -x -e SC1091 scripts/*.sh proxy/docker-entrypoint.d/*.sh proxy/docker-entrypoint.d/*.envsh tests/*.sh
      - name: Compile Python sources
        run: python -m py_compile builder/*.py runtime/scripts/*.py scripts/*.py
      - name: Run targeted QA contract tests
        run: |
          bash tests/test_qa_memory_stability.sh
          bash tests/test_qa_reboot_prepares_stack.sh
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.proxy.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.git.yml --profile local config --quiet

  proxy-smoke:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build proxy image
        run: docker build -t geodock-proxy:ci ./proxy
      - name: Launch with docker compose (HTTP/TLS bridge)
        run: |
          export HOST_PORT_HTTP=8080 HOST_PORT_HTTPS=8443
          docker compose -f docker-compose.proxy.yml up -d --build proxy
          for i in {1..30}; do curl -sS -f http://localhost:8080/_health >/dev/null && break || sleep 2; done
          curl -sS -f http://localhost:8080/_health | jq . || true
      - name: Smoke test search (HTTP)
        run: |
          curl -sS "http://localhost:8080/search/?q=paris&limit=1" | grep -q '"features"' || (echo "search failed" && exit 1)
      - name: Generate test certs and install via script
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=geodock.intra" \
            -keyout /tmp/tls.key -out /tmp/tls.crt >/dev/null 2>&1
          bash scripts/certs_install.sh -c /tmp/tls.crt -k /tmp/tls.key
      - name: Smoke test health (HTTPS, insecure)
        run: |
          for i in {1..20}; do curl -ksSf https://localhost:8443/_health >/dev/null && break || sleep 2; done
          curl -ksS https://localhost:8443/_health | jq . || true
      - name: Save built image as artifact (no push)
        run: |
          mkdir -p dist
          docker save geodock-proxy:ci | gzip > dist/geodock-proxy-image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: geodock-proxy-image
          path: dist/geodock-proxy-image.tar.gz
      - name: Cleanup compose stack
        if: always()
        run: docker compose -f docker-compose.proxy.yml down -v || true

  package-release:
    runs-on: ubuntu-latest
    needs: [static-checks, proxy-smoke]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create V2 tarball
        run: bash scripts/release_v2.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geodock-v2-dist
          path: dist/*.tar.gz
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          body: |
            GeoDock ${{ github.ref_name }}

            - Unified V2 package: proxy, local runtime, bootstrap, status, and QA scripts.
            - Modes: proxy, local, hybrid, failback.
            - Public CI: YAML, shell, Python, Compose, proxy smoke, and V2 package checks.
            - Long prod-like gate remains documented as an operator-run qualification.
